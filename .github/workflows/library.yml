name: Библиотека моделей

on:
  workflow_dispatch:
    inputs:
      what:
        description: "polyhaven | sketchfab-search | sketchfab-get | sand3d | release-clean"
        required: true
        default: polyhaven
      args:
        description: "Для sketchfab: запросы через ; (запрос|animated) или uid через пробел"
        required: false
        default: ""
      sf_token:
        description: "Токен Sketchfab (если нет секрета SKETCHFAB_TOKEN)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  lib:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests pillow

      - name: Poly Haven — каталог и листы превью
        if: contains(inputs.what, 'polyhaven')
        run: python scripts/library/polyhaven.py out/library

      - name: Sketchfab
        if: startsWith(inputs.what, 'sketchfab')
        env:
          SECRET_TOK: ${{ secrets.SKETCHFAB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          T="$SECRET_TOK"; [ -z "$T" ] && T=$(jq -r '.inputs.sf_token // ""' "$GITHUB_EVENT_PATH"); echo "::add-mask::$T"
          export SKETCHFAB_TOKEN="$T"
          if [ "${{ inputs.what }}" = "sketchfab-search" ]; then
            IFS=';' read -ra Q <<< "${{ inputs.args }}"; python scripts/library/sketchfab.py search out/library "${Q[@]}"
          else
            npm install --no-audit --no-fund --loglevel=error @gltf-transform/cli@4 --no-save > /dev/null
            python scripts/library/sketchfab.py get out/library ${{ inputs.args }}
            gh release view lib >/dev/null 2>&1 || gh release create lib --title "Библиотека моделей" --notes "Модели (CC0/MIT/CC-BY)."
            ls out/library/sf_*.glb >/dev/null 2>&1 && gh release upload lib out/library/sf_*.glb --clobber
            mkdir -p out/library/sft && cp out/library/sf_*.glb out/library/sft/ && npm install --no-audit --no-fund --loglevel=error three puppeteer-core --no-save > /dev/null
            CHROME_PATH=/usr/bin/google-chrome node scripts/library/thumbs.mjs out/library/sft out/library/sf_got 2>&1 | grep -v PropertyBinding || true
          fi

      - name: sand3d — механизмы по программам (library/sand3d/*.py)
        if: inputs.what == 'sand3d'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m venv /tmp/s3 && /tmp/s3/bin/pip install -q sand3d
          /tmp/s3/bin/python scripts/library/s3d_build.py ${{ inputs.args }}
          mkdir -p up && for f in out/library/s3/*.glb; do cp "$f" "up/s3_$(basename $f)"; done
          npm install --no-audit --no-fund --loglevel=error --no-save three puppeteer-core > /dev/null
          CHROME_PATH=/usr/bin/google-chrome node scripts/library/thumbs.mjs out/library/s3 out/library/s3_got 2>&1 | grep -v PropertyBinding || true
          gh release view lib >/dev/null 2>&1 || gh release create lib --title "Библиотека моделей" --notes "Модели."
          gh release upload lib up/s3_*.glb out/library/s3_got_*.jpg --clobber

      - name: Удалить файлы из релиза lib (args — регулярное выражение имён)
        if: inputs.what == 'release-clean'
        env:
          GH_TOKEN: ${{ github.token }}
          RX: ${{ inputs.args }}
        run: |
          gh release view lib --json assets -q '.assets[].name' | grep -E "$RX" | while read n; do gh release delete-asset lib "$n" -y && echo "удалён $n"; done

      - name: Каталог в репо, листы в релиз lib
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p library
          cp out/library/*.json library/ 2>/dev/null || true
          gh release view lib >/dev/null 2>&1 || gh release create lib --title "Библиотека моделей" --notes "Каталоги, листы превью, сконвертированные модели (CC0/MIT)."
          ls out/library/*.jpg >/dev/null 2>&1 && gh release upload lib out/library/*.jpg --clobber
          git config user.name "gemvid-bot"; git config user.email "actions@github.com"
          git add library; git commit -qm "Библиотека: ${{ inputs.what }} [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase --autostash -q && git push -q && break; sleep 3; done
