name: Перенос меток релизов (разово)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  retag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while read t sha; do
            gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/$t" -f sha="$sha" -F force=true --jq '.ref+" "+.object.sha' || echo "FAIL $t"
          done <<'MAP'
