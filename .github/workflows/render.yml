name: Рендер шортса

on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Папка эпизода в episodes/ (например, demo)"
        required: true
        default: demo
      demo_voice:
        description: "Тестовый голос espeak, если нет voice.mp3"
        type: boolean
        default: false
      cover_only:
        description: "Только обложка (без видео)"
        type: boolean
        default: false
      sounds_only:
        description: "Только подобрать звуки (проверка)"
        type: boolean
        default: false
      stills:
        description: "Только стоп-кадры сцен (проверка картинки)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "episodes/**/voice.mp3"
      - "episodes/**/episode.json"

permissions:
  contents: write

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Какие эпизоды собирать
        id: eps
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "list=${{ inputs.episode }}" >> "$GITHUB_OUTPUT"
          else
            L=$(git diff --name-only HEAD^ HEAD -- episodes/ | cut -d/ -f2 | sort -u | while read e; do [ -f "episodes/$e/voice.mp3" ] && echo "$e"; done | tr '\n' ' ')
            echo "list=$L" >> "$GITHUB_OUTPUT"
          fi
          echo "Эпизоды: $(grep list "$GITHUB_OUTPUT")"

      - uses: actions/setup-node@v4
        if: steps.eps.outputs.list != ''
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        if: steps.eps.outputs.list != ''
        with:
          python-version: "3.11"
          cache: pip

      - name: Кэш npm и модели Whisper
        if: steps.eps.outputs.list != ''
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/huggingface
            public/snd
          key: deps-${{ hashFiles('package.json', 'requirements.txt') }}

      - name: Системные пакеты (FFmpeg, эмодзи, espeak)
        if: steps.eps.outputs.list != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji espeak-ng > /dev/null

      - name: Зависимости
        if: steps.eps.outputs.list != ''
        run: |
          [ "${{ inputs.cover_only }}" = "true" ] || [ "${{ inputs.stills }}" = "true" ] || pip install -q -r requirements.txt
          npm install --no-audit --no-fund --loglevel=error

      - name: Сборка
        if: steps.eps.outputs.list != ''
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          for EP in ${{ steps.eps.outputs.list }}; do
            if [ "${{ inputs.sounds_only }}" = "true" ]; then node scripts/sounds.mjs "episodes/$EP"; continue; fi
            node scripts/build.mjs "episodes/$EP" ${{ inputs.demo_voice && '--demo-voice' || '' }} ${{ inputs.cover_only && '--cover-only' || '' }} ${{ inputs.stills && '--stills' || '' }}
          done

      - name: Видео в Releases (скачать можно с телефона)
        if: steps.eps.outputs.list != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for EP in ${{ steps.eps.outputs.list }}; do
            [ "${{ inputs.sounds_only }}" = "true" ] && exit 0
            [ "${{ inputs.stills }}" = "true" ] && exit 0
            FILES=""; for f in "out/$EP/$EP.mp4" "out/$EP/preview.jpg" "out/$EP/cover.png"; do [ -f "$f" ] && FILES="$FILES $f"; done
            gh release create "$EP-${{ github.run_number }}" $FILES \
              --title "$EP · сборка ${{ github.run_number }}" \
              --notes "Готовый шортс 1080×1920. Сценарий: episodes/$EP/episode.json"
          done

      - uses: actions/upload-artifact@v4
        if: steps.eps.outputs.list != ''
        with:
          name: shorts-${{ github.run_number }}
          path: out/
          retention-days: 14

      - name: Превью и тайминги обратно в репо
        if: steps.eps.outputs.list != ''
        run: |
          git config user.name "gemvid-bot"
          git config user.email "actions@github.com"
          for EP in ${{ steps.eps.outputs.list }}; do for f in preview.jpg timeline.json words.json cover.png sounds.json stills.jpg; do [ -f "out/$EP/$f" ] && git add -f "out/$EP/$f"; done; done
          git commit -m "Рендер: ${{ steps.eps.outputs.list }} [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 3; done
